name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-22.04]
        preset: [debug, release, instrument-debug, instrument-release]
        include:
          - os: macos-latest
            preset: midi-fx-debug
          - os: macos-latest
            preset: midi-fx-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libxi-dev xvfb xauth
      - name: Configure
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          options=(-DBOILERPLATE_BUILD_TESTS=ON -DBOILERPLATE_MAX_PARALLEL_JOBS=4)
          if [[ "$RUNNER_OS" == macOS ]]; then
            options+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake --preset "$PRESET" "${options[@]}"
      - name: Build all formats and tests
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset ${{ matrix.preset }}
      - name: Test
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.preset }}
      - name: Validate AU
        if: runner.os == 'macOS'
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: bash scripts/validate-au.sh "$PRESET"
      - name: Archive builds (preserve executable permissions)
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          configuration=Release
          if [[ "$PRESET" == *debug ]]; then configuration=Debug; fi
          cd "build/$PRESET/JUCEBoilerplate_artefacts/$configuration"
          formats=(Standalone VST3)
          if [[ "$RUNNER_OS" == macOS ]]; then formats+=(AU); fi
          if [[ "$PRESET" == midi-fx-* ]]; then formats=(AU); fi
          cmake -E tar cf "$GITHUB_WORKSPACE/build/$PRESET/products.tar" --format=gnutar "${formats[@]}"
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.os }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/products.tar
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/*.log
          if-no-files-found: ignore
